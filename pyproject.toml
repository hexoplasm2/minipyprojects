[project]
name = "minipyprojects"
version = "0.1.0"
description = "Collection of mini Python projects"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gradio>=6.30.0",
    "openai>=3.5.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "rich>=15.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
